[project]
name = "my_project"
version = "0.1.0"
description = "Add project description here"

# Pinned to the Python 3.13 series. PyNite's 3D rendering relies on the
# pyvista / vtk / trame stack, which is NOT yet compatible with Python 3.14
# (trame's async server fails under 3.14's event-loop changes, leaving a blank
# viewer). The .python-version file selects the exact interpreter; this cap is
# a second guard so no machine ever resolves to 3.14+. To move up later, once
# the render stack supports it, bump both this line and .python-version.
requires-python = ">=3.13,<3.14"
dependencies = []

# uv only auto-installs its built-in "dev" group on `uv sync`; any other group
# is skipped unless named here. Listing "always" is what makes uv actually
# install it, so `uv run jupyter notebook` works after a plain `uv sync`.
[tool.uv]
default-groups = ["always", "dev"]

[dependency-groups]

# --- Always Installed ---
# Installed automatically by `uv sync` (see [tool.uv] default-groups above).
# Launch the notebook with: uv run jupyter notebook
always = [
    "jupyter",
    "ipykernel",
]

# --- Optional Engineering Packages ---
# Uncomment the packages needed for this project, then re-run `uv sync`.
dev = [
    # --- Core Scientific Stack ---
    #"numpy",
    #"pandas",
    #"scipy",
    #"sympy",
    #"matplotlib",

    # --- Engineering Specific ---
    #"handcalcs",
    #"forallpeople",
    #"steelpy",
    # IMPORTANT: keep the [all] extra. It pulls vtk, pyvista, trame, IPython
    # and ipywidgets, which PyNite's built-in 3D Renderer requires. Plain
    # "PyniteFEA" installs the solver only and Renderer imports will fail.
    #"PyniteFEA[all]",
    #"ezweld",

    # --- Data & Files ---
    #"openpyxl",
    #"requests",
    #"beautifulsoup4",
]
